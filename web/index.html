<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfaf5" />
    <meta name="description" content="Colmeia: as tarefas da casa viram pontos, e os pontos viram uma recompensa para a família inteira." />
    <title>Colmeia</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Chrome's "Desktop site" toggle keeps the hardware touch screen but reports a
      // ~980px viewport, so width-only breakpoints hand a phone the desktop shell.
      // The touch flag survives the toggle; the breakpoints in index.css read it.
      if (navigator.maxTouchPoints > 0) document.documentElement.dataset.touch = "";
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
